        <details id="register-panel">
          <summary>创建账号</summary>
          <form id="register-form">
            <label>手机号<input name="phone" type="tel" required /></label
            ><label
              >密码<input
                name="password"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required /></label
            ><button type="button" id="request-code">获取验证码</button
            ><label
              >验证码<input
                name="code"
                required
                autocomplete="one-time-code" /></label
            ><input name="challenge_id" type="hidden" /><button
              class="primary"
              type="submit"
            >
              注册账号
            </button>
          </form>
          <p id="verification-hint" class="hint">请输入手机收到的验证码。</p>
        </details>
        <details id="reset-panel">
          <summary>忘记密码</summary>
          <form id="reset-form" data-extension="true">
            <label
              >重置密码的手机号<input name="phone" type="tel" required /></label
            ><button type="button" id="reset-code">发送重置验证码</button
            ><label
              >短信验证码<input
                name="code"
                required
                autocomplete="one-time-code" /></label
            ><input name="challenge_id" type="hidden" /><label
              >新密码<input
                name="new_password"
                type="password"
                minlength="8"
                maxlength="128"
                required
                autocomplete="new-password" /></label
            ><button type="submit">重置密码并退出旧设备</button>
          </form>
        </details>
        <p id="private-beta-note" class="hint" hidden>
          当前为私测，账号由运营人员开通。已有账号可直接登录。
        </p>
